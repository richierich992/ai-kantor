{id:1,name:'Trading Saham',c:'#2e9e44',ic:'📈',m:'24h',g:()=>`BBCA ${idr(mv('BBCA'))} (${pct()})\nSinyal: ${pick(['beli bertahap','tahan','pantau support'])}`},

const scene=new THREE.Scene(),rooms={},chars={},picks=[],RL=[];

/* ===== helper 3D ===== */
const M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x,y,z,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);(p||scene).add(m);return m};
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const tex=c=>{const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t};
function label(text,color,sw,sh){const c=cv(512,128),x=c.getContext('2d');x.fillStyle=color;x.beginPath();x.roundRect(4,4,504,120,30);x.fill();
 x.fillStyle='#fff';x.font='bold 54px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,68,470);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(c),depthWrite:false}));s.scale.set(sw,sh,1);return s}
function wrap(x,t,mw){const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const n=l?l+' '+w:w;if(x.measureText(n).width>mw&&l){o.push(l);l=w}else l=n});o.push(l)});return o}
const wp=(r,x,z)=>r.g.localToWorld(new THREE.Vector3(x,0,z));
const plazaPt=()=>new THREE.Vector3(rnd(-14,14),0,rnd(-6,6));

/* ===== layar besar ===== */
const STT={live:['LIVE 24 JAM','#4ade80'],work:['BEKERJA','#fbbf24'],standby:['STANDBY','#94a3b8']};
function draw(r){const x=r.cx,s=STT[r.st];x.fillStyle='#06101f';x.fillRect(0,0,512,288);x.fillStyle=r.col;x.fillRect(0,0,512,50);
 x.textBaseline='middle';x.textAlign='left';x.font='bold 26px system-ui';x.fillStyle='#fff';x.fillText(r.ic+' '+r.name,14,26,300);
 if(!r.meet){x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.roundRect(322,10,178,30,15);x.fill();x.font='bold 18px system-ui';x.fillStyle=s[1];x.textAlign='center';x.fillText('● '+s[0],411,26)}
 x.textAlign='left';x.font='22px "Courier New",monospace';x.fillStyle='#9ff5c1';
 wrap(x,r.txt,484).slice(-7).forEach((l,i)=>x.fillText(l,14,80+i*29));
 r.tx.needsUpdate=true;r.lamp.material.color.set(s[1])}
function setSt(r,s){r.st=s;if(r.mon)r.mon.color.set(s==='work'?0xffffff:s==='live'?0x7dd3fc:0x1e3a5f);draw(r)}

/* ===== ruangan ===== */
function mkRoom([x,z,yaw,id]){
 const d=D.find(q=>q.id===id)||{name:'Ruang Meeting',c:'#66708c',ic:'🤝',meet:1};
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=yaw;scene.add(g);
 const col=new THREE.Color(d.c),white=new THREE.Color(1,1,1),lt=col.clone().lerp(white,.78),wl=col.clone().lerp(white,.4);
 const r={id,d,name:d.name,col:d.c,ic:d.ic,g,yaw,meet:d.meet,st:'standby',lock:false,txt:d.meet?'Tempat agent berkumpul.':'Siap menerima tugas.'};
 const fl=box(W,.14,DP,lt,0,.07,0,g);
 box(W,WH,.25,wl,0,WH/2,-DP/2,g);box(.25,WH,DP,wl,-W/2,WH/2,0,g);box(.25,WH,DP,wl,W/2,WH/2,0,g);box(W,.3,.25,col,0,.15,DP/2,g);
 const c=cv(512,288);r.cx=c.getContext('2d');r.tx=tex(c);
 box(4.8,2.8,.1,0x0b1220,0,1.95,-DP/2+.17,g);
 const sc=new THREE.Mesh(new THREE.PlaneGeometry(4.6,2.6),new THREE.MeshBasicMaterial({map:r.tx}));sc.position.set(0,1.95,-DP/2+.23);g.add(sc);
 fl.userData.id=sc.userData.id=id;picks.push(fl,sc);
 r.lamp=new THREE.Mesh(new THREE.SphereGeometry(.28,12,12),new THREE.MeshBasicMaterial({color:0x64748b}));r.lamp.position.set(0,WH+.35,-DP/2);g.add(r.lamp);
 const lb=label((d.meet?'':id+' ')+d.name,d.c,6.4,1.6);lb.position.set(0,WH+1.5,-DP/2+.5);g.add(lb);
 if(d.meet){
  const t=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,.12,24),M(0xc79b64));t.position.set(0,.8,.5);g.add(t);box(.3,.8,.3,0x7a5a38,0,.4,.5,g);
  for(let i=0;i<6;i++){const a=i/6*PI*2,s=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.5,12),M(0x475569));s.position.set(Math.cos(a)*2.3,.25,.5+Math.sin(a)*2.3);g.add(s)}
 }else{
  box(2.6,.8,1,0x9c7a54,-1.8,.4,-1.9,g);box(.15,.35,.15,0x1f2937,-1.8,.97,-2.05,g);box(1.15,.7,.07,0x111827,-1.8,1.5,-2.05,g);
  r.mon=new THREE.MeshBasicMaterial({color:0x1e3a5f});const ms=new THREE.Mesh(new THREE.PlaneGeometry(1.03,.58),r.mon);ms.position.set(-1.8,1.5,-2.01);g.add(ms);
  box(2.6,.8,1,0x9c7a54,1.8,.4,-1.9,g);box(.9,.05,.6,0xcbd5e1,1.8,.83,-1.8,g);
  const lid=box(.9,.6,.04,0x1f2937,1.8,1.12,-2.1,g);lid.rotation.x=-.2;
  const ls=new THREE.Mesh(new THREE.PlaneGeometry(.8,.5),new THREE.MeshBasicMaterial({color:new THREE.Color(d.c).lerp(white,.4)}));ls.position.set(1.8,1.12,-2.07);ls.rotation.x=-.2;g.add(ls);
  box(.5,.4,.5,0x7a4b2a,3.1,.2,2.6,g);const pl=new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),M(0x2f9e5a));pl.position.set(3.1,.9,2.6);g.add(pl);
 }
 rooms[id]=r;RL.push(r);draw(r);return r}

function mkChar(r){
 const g=new THREE.Group(),c={g,r,d:r.d,path:[],t:0,loc:r,wait:rnd(2,6),face:r.yaw+PI,work:false},col=r.col;
 const limb=(w,h,d,cl,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);box(w,h,d,cl,0,-h/2,0,p);g.add(p);return p};
 c.legL=limb(.24,.75,.26,0x2b3350,-.17,.78);c.legR=limb(.24,.75,.26,0x2b3350,.17,.78);
 box(.62,.74,.36,col,0,1.15,0,g);
 c.armL=limb(.18,.68,.2,col,-.42,1.48);c.armR=limb(.18,.68,.2,col,.42,1.48);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),M(pick([0xf1c27d,0xe0ac69,0xc68642,0x8d5524])));h.position.y=1.8;g.add(h);
 box(.56,.2,.5,0x1a1a1a,0,1.98,-.02,g);box(.07,.07,.05,0x111111,-.1,1.84,.26,g);box(.07,.07,.05,0x111111,.1,1.84,.26,g);
 g.position.copy(r.spot);g.rotation.y=r.yaw+PI;scene.add(g);return c}

function go(c,tr,spot,face){const cu=c.loc,p=[];
 if(cu&&cu!==tr)p.push(cu.inside,cu.front);
 if(cu!==tr&&(cu||tr))p.push(plazaPt());
 if(tr&&cu!==tr)p.push(tr.front,tr.inside);
 p.push(spot);c.path=p.map(v=>v.clone());c.loc=tr;c.face=face;c.done=null}
const turn=(c,a,k)=>{let d=a-c.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));c.g.rotation.y+=d*Math.min(1,k)};

function step(c,dt){
 const p=c.path[0];let mvg=false;
 if(p){const dx=p.x-c.g.position.x,dz=p.z-c.g.position.z,d=Math.hypot(dx,dz);
  if(d<.12){c.path.shift();if(!c.path.length&&c.done){const f=c.done;c.done=null;f()}}
  else{const s=Math.min(d,3.4*dt);c.g.position.x+=dx/d*s;c.g.position.z+=dz/d*s;turn(c,Math.atan2(dx,dz),dt*10);mvg=true}
 }else if(c.face!=null)turn(c,c.face,dt*8);
 c.t+=dt*(mvg?9:1);const s=mvg?Math.sin(c.t)*.7:0,ty=!mvg&&c.work;
 c.legL.rotation.x=s;c.legR.rotation.x=-s;
 c.armL.rotation.x=mvg?-s:ty?-1.2+Math.sin(c.t*14)*.12:Math.sin(c.t)*.04;
 c.armR.rotation.x=mvg?s:ty?-1.2+Math.cos(c.t*14)*.12:-Math.sin(c.t)*.04;
 c.g.position.y=mvg?Math.abs(Math.sin(c.t))*.08:0;
 if(!c.path.length&&!c.busy&&!c.work&&c.d.mode!=='24h'){c.wait-=dt;if(c.wait<=0){c.wait=rnd(5,10);const k=Math.random();
  if(k<.3)go(c,c.r,c.r.spot,c.r.yaw+PI);else if(k<.5)go(c,null,plazaPt(),null);else{const t=pick(RL);go(c,t,wp(t,rnd(-2.5,2.5),rnd(0,2.5)),null)}}}
}

/* ===== scene ===== */
function boot(){
 const host=$('map');
 rend=new THREE.WebGLRenderer({antialias:true});rend.setPixelRatio(Math.min(devicePixelRatio,2));rend.setSize(host.clientWidth,host.clientHeight);host.appendChild(rend.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x6a8f6a,1.1));const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(30,60,25);scene.add(sun);
 ctl=new OrbitControls(cam,rend.domElement);ctl.target.set(0,0,2);ctl.enableDamping=true;ctl.maxPolarAngle=1.42;ctl.minDistance=6;ctl.maxDistance=140;

 ctl.addEventListener('start',()=>tg=null);

 box(300,.2,300,0x7fbf7a,0,-.5,0);box(68,.4,40,0xe6ebf5,0,-.2,0);
 for(let i=0;i<30;i++){const a=i/30*PI*2,x=Math.cos(a)*(48+rnd(0,18)),z=Math.sin(a)*(32+rnd(0,16));
  box(.5,2,.5,0x6b4a2b,x,1,z);const cn=new THREE.Mesh(new THREE.ConeGeometry(2.2,5,8),M(0x2f7a43));cn.position.set(x,4.5,z);scene.add(cn)}
 const fc=cv(1024,512),fx=fc.getContext('2d');fx.fillStyle='rgba(255,255,255,.85)';fx.beginPath();fx.roundRect(8,8,1008,496,60);fx.fill();
 fx.fillStyle='#24407a';fx.textAlign='center';fx.font='bold 130px system-ui';fx.fillText('🧠 Kantor AI',512,230);fx.font='50px system-ui';fx.fillText('Bersama Membangun Masa Depan Finansial',512,340,960);
 const fm=new THREE.Mesh(new THREE.PlaneGeometry(16,8),new THREE.MeshBasicMaterial({map:tex(fc),transparent:true}));fm.rotation.x=-PI/2;fm.position.y=.08;scene.add(fm);
 [[-9,-4],[9,-4],[-9,5],[9,5]].forEach(([x,z])=>{box(.9,.6,.9,0x7a4b2a,x,.3,z);const s=new THREE.Mesh(new THREE.SphereGeometry(.9,10,8),M(0x2f9e5a));s.position.set(x,1.3,z);scene.add(s)});
 box(.6,4,.6,0x14213d,-4.4,2,18);box(.6,4,.6,0x14213d,4.4,2,18);box(9.4,.6,.6,0x14213d,0,4.2,18);
 const sg=label('KANTOR AI','#14213d',8,2);sg.position.set(0,5.7,18);scene.add(sg);box(2.6,1,.9,0x2a4a8a,-2.4,.5,14.5);

 SL.forEach(mkRoom);scene.updateMatrixWorld(true);
 RL.forEach(r=>{r.front=wp(r,0,DP/2+1.5);r.inside=wp(r,0,1.2);r.spot=wp(r,-1.8,-.4)});

 const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let pd;
 rend.domElement.addEventListener('pointerdown',e=>pd=[e.clientX,e.clientY]);
 rend.domElement.addEventListener('pointerup',e=>{if(!pd||Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>6)return;
  const b=rend.domElement.getBoundingClientRect();mp.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mp,cam);
  const h=ray.intersectObjects(picks,false)[0];if(h)openDiv(h.object.userData.id)});
 $('reset').onclick=()=>{tg={t:new THREE.Vector3(0,0,2),c:new THREE.Vector3(34,44,58)}};
 addEventListener('resize',()=>{rend.setSize(host.clientWidth,host.clientHeight);cam.aspect=host.clientWidth/host.clientHeight;cam.updateProjectionMatrix()});
 $('legend').innerHTML=D.slice().sort((a,b)=>a.id-b.id).map(d=>`<div data-id="${d.id}"><b style="background:${d.c}">${d.id}</b>${d.name}</div>`).join('');
 $('legend').onclick=e=>{const t=e.target.closest('[data-id]');if(t)openDiv(+t.dataset.id)};
 const clk=new THREE.Clock();
 (function loop(){const dt=Math.min(clk.getDelta(),.05);Object.values(chars).forEach(c=>step(c,dt));
  if(tg){ctl.target.lerp(tg.t,.07);cam.position.lerp(tg.c,.07)}ctl.update();rend.render(scene,cam);requestAnimationFrame(loop)})();
}
function focus(r){const f=new THREE.Vector3(Math.sin(r.yaw),0,Math.cos(r.yaw));tg={t:r.g.position.clone().setY(1.5),c:r.g.position.clone().add(f.multiplyScalar(13)).setY(10)}}

/* ===== agent ===== */
function applyMode(d){const r=rooms[d.id],c=chars[d.id],live=d.mode==='24h';if(c.busy)return;c.work=live;setSt(r,live?'live':'standby');if(live)go(c,r,r.spot,r.yaw+PI)}
const baseSt=d=>d.mode==='24h'?'live':'standby';
const send=(id,who,text)=>push(ref(db,`offices/${oid}/messages/${id}`),{who,text,t:Date.now(),uid:auth.currentUser.uid,divName:D.find(x=>x.id===id).name});

async function job(id,q){
 const r=rooms[id],c=chars[id],d=r.d;r.lock=true;c.busy=true;setSt(r,'work');r.txt='📩 '+q;draw(r);
 while(c.path.length)await sleep(200);
 await new Promise(res=>{go(c,r,r.spot,r.yaw+PI);c.done=res});
 c.work=true;
 for(let i=0;i<6;i++){r.txt='⚙️ Menganalisis'+'.'.repeat(i%4);draw(r);await sleep(450)}
 const ans=demoAnswer(d,q);
 for(let i=0;i<=ans.length;i+=2){r.txt=ans.slice(0,i);draw(r);await sleep(25)}
 send(id,'ai',ans);
 r.lock=false;c.busy=false;c.work=d.mode==='24h';c.wait=6;setSt(r,baseSt(d));
}
function demoAnswer(d,text){const t=text.toLowerCase();
 if(/\b(hai|halo)\b/.test(t))return `Halo! Saya agent ${d.name}. Ada yang bisa saya bantu?`;
 if(t.includes('harga'))return d.g?d.g():'Data harga akan diperbarui di layar divisi.';
 if(t.includes('reksadana'))return 'Reksadana adalah kumpulan dana yang dikelola profesional oleh manajer investasi.';
 if(t.includes('bitcoin')||t.includes('btc'))return 'Bitcoin adalah aset digital terdesentralisasi berbasis blockchain.';
 if(t.includes('emas'))return 'Emas logam mulia sering dipakai sebagai pelindung nilai dari inflasi.';
 if(t.includes('resep'))return 'Resep masakan dan minuman siap dibagikan sesuai permintaan Anda.';
 return `Jawaban dari agent ${d.name}. ${d.g?d.g():'Silakan ajukan pertanyaan lebih spesifik.'}`}

/* ===== chat ===== */
function modeLbl(){const d=D.find(x=>x.id===cur);if(d)$('mode').textContent=d.mode==='24h'?'🟢 Agent 24 jam':'⚪ Saat dipanggil'}
function openDiv(id){const r=rooms[id];focus(r);if(!r||r.meet)return;cur=id;$('ct').textContent=`${r.ic} ${r.name}`;$('ct').style.color=r.col;$('chat').classList.add('open');modeLbl();
 if(unsub)unsub();
 unsub=onValue(ref(db,`offices/${oid}/messages/${id}`),s=>{const v=s.val(),a=[];if(v)Object.values(v).forEach(m=>a.push(m));a.sort((x,y)=>(x.t||0)-(y.t||0));
  const b=$('chat-body');b.innerHTML=a.map(m=>`<div class="msg ${m.who==='ai'?'ai':'user'}"><div class="bubble">${esc(m.text)}</div><div class="meta">${m.who==='ai'?esc(r.name):'Anda'} • ${new Date(m.t||0).toLocaleTimeString('id-ID')}</div></div>`).join('');b.scrollTop=b.scrollHeight})}
$('cx').onclick=()=>{$('chat').classList.remove('open');cur=null;if(unsub){unsub();unsub=null}};
$('mode').onclick=()=>{const d=D.find(x=>x.id===cur);if(d)set(ref(db,`offices/${oid}/modes/${d.id}`),d.mode==='24h'?'cmd':'24h')};
function sendChat(){const i=$('ci'),t=i.value.trim();if(!t||!cur)return;i.value='';const id=cur;send(id,'user',t);
 const c=chars[id];c.q=(c.q||Promise.resolve()).then(()=>job(id,t))}
$('send').onclick=sendChat;
$('ci').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
$('auto').onclick=e=>{autoOn=!autoOn;e.target.classList.toggle('on',autoOn);e.target.textContent='Agent 24 Jam: '+(autoOn?'ON':'OFF')};

/* ===== login & Firebase ===== */
$('go').onclick=async()=>{
 const code=$('code').value.trim();if(!code)return;oid=code.replace(/[.#$\[\]\/]/g,'_');
 try{
  app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);
  const cr=await signInAnonymously(auth);
  $('status').textContent='Online • '+cr.user.uid.slice(0,6);
  $('login').classList.add('hidden');$('ui').classList.remove('hidden');
  boot();
  /* mode tiap agent (sinkron di semua perangkat) */
  onValue(ref(db,`offices/${oid}/modes`),s=>{const v=s.val()||{};
   D.forEach(d=>{const m=v[d.id]||d.m||'cmd';if(m!==d.mode){d.mode=m;applyMode(d)}});modeLbl()});
  /* layar besar tiap ruangan menampilkan pesan terakhir */
  D.forEach(d=>onValue(query(ref(db,`offices/${oid}/messages/${d.id}`),limitToLast(1)),s=>{
   const v=s.val();if(!v)return;const m=Object.values(v)[0],r=rooms[d.id];if(r.lock)return;r.txt=(m.who==='ai'?'':'❓ ')+m.text;draw(r)}));
  /* agent 24 jam: hanya satu perangkat yang menulis tiap 30 dtk (transaction) */
  setInterval(()=>{if(!autoOn)return;D.filter(d=>d.mode==='24h').forEach(async d=>{
   try{const res=await runTransaction(ref(db,`offices/${oid}/runs/${d.id}`),v=>Date.now()-(v||0)>28000?Date.now():undefined);
    if(res.committed)send(d.id,'ai',d.g?d.g():`Laporan rutin ${d.name}: semua normal.`)}catch(e){}})},6000);
 }catch(e){alert('Gagal koneksi Firebase: '+e.message)}
};
</script>
