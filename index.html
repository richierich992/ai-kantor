<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantor AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#14213d;--ink:#e8eefc}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;
 background:radial-gradient(circle at 12% 18%,#3f8f4f 0 7%,transparent 7.5%),radial-gradient(circle at 90% 85%,#2f7a43 0 9%,transparent 9.5%),
 radial-gradient(circle at 6% 80%,#4da05c 0 6%,transparent 6.5%),linear-gradient(160deg,#8fc7e8,#cfe6d6 55%,#9ccf9f)}
.hidden{display:none!important}

/* Login */
#login{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#14213d,#1f3b6e);padding:24px;text-align:center}
#login h2{font-size:28px;margin-bottom:6px}
#login p{color:#b8c6e6;font-size:14px;margin-bottom:18px}
#login input{padding:12px 16px;font-size:16px;border-radius:12px;border:2px solid #3a5a9a;background:#0f1a33;color:#fff;width:260px;text-align:center;margin-bottom:14px}
#login button{padding:12px 32px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#ffc93c;color:#2a1d00;cursor:pointer}
#login .note{font-size:12px;max-width:300px;margin:16px 0 0}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(20,33,61,.92);backdrop-filter:blur(6px)}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}
.right{display:flex;align-items:center;gap:12px;font-size:12px;color:#b8c6e6}
#auto-toggle{background:#26396b;border:1px solid #4a64a8;color:#fff;padding:5px 12px;border-radius:16px;font-size:12px;cursor:pointer}
#auto-toggle.active{background:#4ade80;color:#06280f;border-color:#4ade80}

/* Stage */
#map{position:fixed;inset:52px 0 0 0;perspective:1800px;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform-origin:center}
#building{position:relative;display:grid;grid-template-columns:repeat(6,150px);grid-template-rows:repeat(5,140px);gap:10px;padding:16px;
 background:#e9eef7;border:6px solid #b7c3da;border-radius:18px;transform:rotateX(34deg) rotateZ(-5deg);transform-style:preserve-3d;
 box-shadow:0 10px 0 #8d9bb8,0 18px 0 #6f7e9f,0 40px 60px rgba(10,30,60,.45)}

.room{--c:#888;position:relative;border-radius:10px;cursor:pointer;overflow:hidden;
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#fff),color-mix(in srgb,var(--c) 30%,#fff));
 border:4px solid color-mix(in srgb,var(--c) 70%,#222);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#111);transition:transform .15s,filter .15s}
.room:hover{transform:translateZ(14px) translateY(-4px);filter:brightness(1.06);z-index:5}
.tag{position:absolute;top:6px;left:6px;right:6px;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;background:var(--c);
 color:#fff;font-weight:800;font-size:12px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tag b{display:grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.28);font-size:11px}
.floor{position:absolute;inset:36px 8px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:center}
.floor i{height:26px;border-radius:5px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 40%,#999);position:relative}
.floor i::before{content:"";position:absolute;left:50%;top:-9px;width:16px;height:11px;transform:translateX(-50%);border-radius:2px;background:#10192e;border:2px solid #3b4a6b}
.floor i::after{content:"";position:absolute;left:50%;top:5px;width:8px;height:8px;transform:translateX(-50%);border-radius:2px;background:color-mix(in srgb,var(--c) 45%,#fff)}
.ico{position:absolute;right:8px;bottom:18px;font-size:26px;opacity:.9}
.rs{position:absolute;left:6px;right:6px;bottom:4px;z-index:3;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(10,18,40,.85);color:#9ff5c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lobby{grid-area:2/2/5/5;border-radius:12px;background:repeating-conic-gradient(#f7f9fd 0 25%,#e6ecf6 0 50%) 0 0/48px 48px;border:3px dashed #aab7d0;display:grid;place-items:center;text-align:center;color:#24407a}
.rug{padding:18px 26px;border-radius:14px;background:rgba(255,255,255,.85);border:2px solid #b9c8e6}
.rug .logo{font-size:38px}.rug h3{font-size:22px}.rug p{font-size:12px;max-width:190px;margin:4px auto 0}
.plant{position:absolute;font-size:26px}
.entrance{grid-area:5/1/6/5;border-radius:12px;background:#dfe6f2;border:3px solid #aab7d0;display:flex;align-items:center;justify-content:center;gap:18px;color:#24407a;font-weight:800}
.entrance .desk{padding:10px 24px;border-radius:30px;background:#fff;border:3px solid #7e93c2;box-shadow:0 4px 0 #7e93c2}
.meeting{grid-area:4/1/5/2;background:linear-gradient(#f0f1f5,#d9dde8);border:4px solid #66708c;color:#2b3350;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:12px}
.meeting span{font-size:28px}

/* Characters */
.char{position:absolute;z-index:20;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#fff;border:3px solid var(--c);
 box-shadow:0 3px 0 rgba(0,0,0,.25);transition:left 1.4s ease-in-out,top 1.4s ease-in-out;pointer-events:none}
.char.walk{animation:hop .35s ease-in-out infinite}
@keyframes hop{50%{margin-top:-5px}}

/* Legend & slogan */
#legend{position:fixed;right:14px;top:70px;z-index:60;width:200px;padding:10px 12px;border-radius:14px;background:rgba(20,33,61,.94);border:1px solid #3a5a9a;max-height:calc(100vh - 140px);overflow:auto}
#legend div{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12px;cursor:pointer}
#legend div:hover{color:#ffc93c}
#legend b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;flex:none;color:#fff}
#slogan{position:fixed;left:16px;bottom:14px;z-index:60;padding:8px 14px;border-radius:12px;background:rgba(20,33,61,.9);font-size:13px;font-weight:700}
#ticker{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;font-size:12px;padding:5px 12px;border-radius:20px;background:rgba(20,33,61,.9);color:#b8c6e6;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat */
#chat{position:fixed;z-index:150;top:52px;right:0;bottom:0;width:420px;display:none;flex-direction:column;background:#0f1a33;border-left:1px solid #3a5a9a}
#chat.open{display:flex}
.ch{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26396b;font-weight:800}
.ch button{background:none;border:0;color:#b8c6e6;font-size:20px;cursor:pointer}
#screen{margin:10px 14px 0;padding:8px 10px;border-radius:8px;background:#000;border:2px solid var(--c,#4ade80);color:#9ff5c1;font:12px/1.4 "Courier New",monospace;min-height:44px;max-height:90px;overflow:auto}
#chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;display:flex;flex-direction:column;gap:3px}
.msg.ai{align-self:flex-start}.msg.user{align-self:flex-end}
.bubble{padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.ai .bubble{background:#1c2b52;border-bottom-left-radius:3px}
.msg.user .bubble{background:#ffc93c;color:#2a1d00;border-bottom-right-radius:3px}
.meta{font-size:10px;color:#8fa2cc}
.msg.user .meta{text-align:right}
.inp{padding:12px 14px;border-top:1px solid #26396b;display:flex;gap:8px}
.inp textarea{flex:1;resize:none;border:1px solid #3a5a9a;border-radius:10px;background:#0a1226;color:#fff;padding:9px 11px;font:14px inherit;min-height:42px}
.inp button{width:46px;border:0;border-radius:10px;background:#ffc93c;color:#2a1d00;font-weight:800;cursor:pointer}

/* Meeting overlay */
#meet{position:fixed;inset:0;z-index:250;display:none;place-items:center;background:rgba(10,20,45,.8);backdrop-filter:blur(6px)}
#meet.open{display:grid}
.mbox{width:340px;padding:20px;border-radius:16px;background:#e9eef7;border:4px solid #ffc93c;color:#24407a;text-align:center}
.mtable{position:relative;height:120px;margin:14px 0;border-radius:60px;background:#c79b64;border:4px solid #8a6538}
.mav{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid;display:grid;place-items:center;animation:hop .8s infinite}
#mline{font-weight:700;font-size:14px}

@media(max-width:820px){
 #legend{display:none}
 #chat{top:auto;width:100%;height:62vh;border-left:0;border-top:1px solid #3a5a9a}
 .right span{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <h2>🏢 Kantor AI</h2>
  <p>Masukkan kode kantor untuk sinkron di semua perangkat</p>
  <input id="office-code" value="AI2026" placeholder="Kode kantor">
  <button id="btn-login">Masuk</button>
  <p class="note">Pakai kode yang sama di semua perangkat. Chat tersimpan di Firebase.</p>
</div>

<div id="ui" class="hidden">
  <header>
    <div class="brand"><span class="dot"></span>Kantor AI</div>
    <div class="right"><span id="status">Menghubungkan...</span><button id="auto-toggle" class="active">Auto 24 Jam: ON</button></div>
  </header>
  <div id="map"><div id="stage"><div id="building"></div></div></div>
  <div id="legend"></div>
  <div id="slogan">Satu Kantor, Banyak Peluang Bersama AI</div>
  <div id="ticker">Sistem siap</div>

  <div id="chat">
    <div class="ch"><span id="chat-title">Divisi</span><button id="chat-close" aria-label="Tutup">✕</button></div>
    <div id="screen">Pilih ruangan untuk mulai.</div>
    <div id="chat-body"></div>
    <div class="inp"><textarea id="chat-input" placeholder="Tanya divisi ini... (Enter = kirim)"></textarea><button id="btn-send" aria-label="Kirim">➤</button></div>
  </div>

  <div id="meet"><div class="mbox"><b>RAPAT DIVISI</b><div class="mtable" id="mtable"></div><div id="mline"></div></div></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, push } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

 const firebaseConfig = {
    apiKey: "AIzaSyBeb1L6dCevfzX2tw__6MGWfpB6jfKTO6M",
    authDomain: "ai-kantor-project.firebaseapp.com",
    databaseURL: "https://ai-kantor-project-default-rtdb.firebaseio.com",
    projectId: "ai-kantor-project",
    storageBucket: "ai-kantor-project.firebasestorage.app",
    messagingSenderId: "1057185794628",
    appId: "1:1057185794628:web:7ac036e7c5df69bdbbca11",
    measurementId: "G-SRBJYD2F77"
  };


/* id, nama, warna, ikon, avatar, auto-teks. Posisi ruang: [row, col, rowSpan, colSpan] di grid 6x5 */
const DIVISIONS = [
 {id:1,name:'Trading Saham',color:'#2e9e44',icon:'📈',emoji:'👩‍💼',pos:[1,1],auto:'Saham ABC naik 2,4% hari ini.'},
 {id:2,name:'Invest Saham',color:'#2f7fe0',icon:'📊',emoji:'👨‍💼',pos:[1,2]},
 {id:3,name:'Invest Dividen Saham',color:'#8a4fd8',icon:'💰',emoji:'👩‍💻',pos:[1,3]},
 {id:4,name:'Bibit Reksadana',color:'#1aa37a',icon:'🌱',emoji:'🧑‍💼',pos:[1,4]},
 {id:5,name:'Bitcoin Indodax',color:'#f08a1c',icon:'₿',emoji:'👨‍💻',pos:[1,5],auto:'BTC di Indodax: Rp 714.250.000'},
 {id:6,name:'Bitcoin Toko Crypto',color:'#e0409a',icon:'🏪',emoji:'👩‍🔧',pos:[1,6],auto:'Crypto Update: ETH menguat 1,8%'},
 {id:7,name:'Emas Logam Mulia',color:'#c99a1c',icon:'🥇',emoji:'🧑‍🏫',pos:[2,1]},
 {id:8,name:'Pencatat Keuangan',color:'#2a4a8a',icon:'📒',emoji:'🧑‍💼',pos:[3,1]},
 {id:9,name:'Multimedia Video',color:'#8f52e8',icon:'🎬',emoji:'🎥',pos:[2,5]},
 {id:10,name:'Multimedia Grafis',color:'#18a0d8',icon:'🎨',emoji:'👩‍🎨',pos:[2,6]},
 {id:12,name:'Online Shop',color:'#d6336c',icon:'🛒',emoji:'🧑‍💼',pos:[3,5]},
 {id:13,name:'Viral / Trend News',color:'#16a6a6',icon:'📰',emoji:'🧑‍💻',pos:[3,6],auto:'News: AI kantor isometrik trending.'},
 {id:14,name:'Resep Masakan & Minuman',color:'#ee5a7a',icon:'🍜',emoji:'👩‍🍳',pos:[4,5]},
 {id:11,name:'Coding',color:'#6aa71a',icon:'💻',emoji:'👨‍💻',pos:[4,6]},
 {id:15,name:'AI Chatbot',color:'#6f4fe0',icon:'🤖',emoji:'🧑‍💼',pos:[5,5],span:2}
];

let app, auth, db, officeId, currentDiv = null, autoEnabled = true, unsub = null;
const chars = [], cells = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===== Login ===== */
$('btn-login').onclick = async () => {
  const code = $('office-code').value.trim();
  if (!code) return;
  officeId = code.replace(/[.#$\[\]\/]/g, '_');
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const cred = await signInAnonymously(auth);
    $('status').textContent = 'Online • ' + cred.user.uid.slice(0, 6);
    $('login').classList.add('hidden');
    $('ui').classList.remove('hidden');
    buildOffice();
    fitStage();
  } catch (e) {
    alert('Gagal koneksi Firebase: ' + e.message);
  }
};
$('auto-toggle').onclick = e => {
  autoEnabled = !autoEnabled;
  e.target.classList.toggle('active', autoEnabled);
  e.target.textContent = 'Auto 24 Jam: ' + (autoEnabled ? 'ON' : 'OFF');
};

/* ===== Gedung ===== */
function buildOffice() {
  const b = $('building');
  b.innerHTML = `
    <div class="lobby" id="lobby"><span class="plant" style="left:12px;top:10px">🪴</span><span class="plant" style="right:12px;top:10px">🪴</span>
      <span class="plant" style="left:12px;bottom:10px">🌿</span><span class="plant" style="right:12px;bottom:10px">🌿</span>
      <div class="rug"><div class="logo">🧠</div><h3>Kantor AI</h3><p>Bersama Membangun Masa Depan Finansial</p></div></div>
    <div class="room meeting"><span>🖥️</span>Ruang Meeting</div>
    <div class="entrance"><div class="desk">🛎️ Resepsionis</div><div>🚪 Pintu Masuk</div></div>`;

  DIVISIONS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'room';
    el.style.setProperty('--c', d.color);
    el.style.gridArea = `${d.pos[0]}/${d.pos[1]}/span 1/span ${d.span || 1}`;
    el.innerHTML = `<div class="tag"><b>${d.id}</b>${d.name}</div>
      <div class="floor"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="ico">${d.icon}</div><div class="rs" id="rs-${d.id}">Siap</div>`;
    el.onclick = () => openDivision(d.id);
    b.appendChild(el);
    cells.set(d.id, el);
  });

  /* Karakter */
  DIVISIONS.forEach(d => {
    const c = document.createElement('div');
    c.className = 'char';
    c.style.setProperty('--c', d.color);
    c.textContent = d.emoji;
    b.appendChild(c);
    chars.push({ el: c, divId: d.id, home: d.id, color: d.color, emoji: d.emoji });
  });
  requestAnimationFrame(() => chars.forEach(c => placeIn(c, cells.get(c.home), true)));

  /* Legend */
  $('legend').innerHTML = DIVISIONS.slice().sort((a, b) => a.id - b.id).map(d =>
    `<div data-id="${d.id}"><b style="background:${d.color}">${d.id}</b>${d.name}</div>`).join('');
  $('legend').onclick = e => { const r = e.target.closest('[data-id]'); if (r) openDivision(+r.dataset.id); };

  setInterval(walkSome, 3500);
  setInterval(autoPost, 20000);
  const last = localStorage.getItem('last_div_' + officeId);
  if (last) setTimeout(() => openDivision(+last), 600);
}

function placeIn(c, target, home) {
  const lobby = $('lobby');
  const t = target || lobby;
  const jitter = home ? 0 : (Math.random() - .5) * 40;
  c.el.style.left = (t.offsetLeft + t.offsetWidth / 2 - 13 + jitter) + 'px';
  c.el.style.top = (t.offsetTop + t.offsetHeight / 2 + 8 - 13 + (home ? 0 : jitter)) + 'px';
}
function walkSome() {
  chars.forEach(c => {
    if (Math.random() > .25) return;
    const toHome = c.divId !== c.home && Math.random() < .5;
    const targetId = toHome ? c.home : DIVISIONS[Math.floor(Math.random() * DIVISIONS.length)].id;
    c.divId = targetId;
    placeIn(c, Math.random() < .3 ? $('lobby') : cells.get(targetId), toHome);
    c.el.classList.add('walk');
    setTimeout(() => c.el.classList.remove('walk'), 1400);
  });
}
function autoPost() {
  if (!autoEnabled || !db) return;
  DIVISIONS.filter(d => d.auto).forEach(d => {
    if (Math.random() < .35) { sendMessage(d.id, 'ai', d.auto); setRoom(d.id, d.auto); }
  });
}

/* Skala agar seluruh gedung muat di layar */
function fitStage() {
  const s = Math.min(innerWidth / 1100, (innerHeight - 52) / 700, 1.15);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage);

function setRoom(id, text) {
  const r = $('rs-' + id); if (r) r.textContent = text;
  $('ticker').textContent = text;
  if (currentDiv === id) $('screen').textContent = text;
}

/* ===== Firebase pesan ===== */
function sendMessage(divId, who, text) {
  const d = DIVISIONS.find(x => x.id === divId);
  push(ref(db, `offices/${officeId}/messages/${divId}`),
    { who, text, t: Date.now(), uid: auth.currentUser.uid, divName: d?.name || '' });
}
function listen(divId) {
  if (unsub) unsub();
  const d = DIVISIONS.find(x => x.id === divId);
  unsub = onValue(ref(db, `offices/${officeId}/messages/${divId}`), snap => {
    const data = snap.val(), arr = [];
    if (data) Object.entries(data).forEach(([k, v]) => arr.push({ id: k, ...v }));
    arr.sort((a, b) => (a.t || 0) - (b.t || 0));
    const body = $('chat-body');
    body.innerHTML = arr.map(m => `<div class="msg ${m.who === 'ai' ? 'ai' : 'user'}"><div class="bubble">${esc(m.text)}</div>
      <div class="meta">${m.who === 'ai' ? esc(d.name) : 'Anda'} • ${new Date(m.t || 0).toLocaleTimeString('id-ID')}</div></div>`).join('');
    body.scrollTop = body.scrollHeight;
  });
}

/* ===== Chat ===== */
function openDivision(id) {
  const d = DIVISIONS.find(x => x.id === id); if (!d) return;
  currentDiv = id;
  localStorage.setItem('last_div_' + officeId, id);
  $('chat-title').textContent = `${d.icon} ${d.name}`;
  $('chat-title').style.color = d.color;
  $('chat').style.setProperty('--c', d.color);
  $('chat').classList.add('open');
  $('screen').textContent = `Selamat datang di divisi ${d.name}. Silakan tanya apa saja.`;
  listen(id);
}
$('chat-close').onclick = () => { $('chat').classList.remove('open'); currentDiv = null; };
$('btn-send').onclick = sendChat;
$('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });

function sendChat() {
  const inp = $('chat-input'), text = inp.value.trim();
  if (!text || !currentDiv) return;
  inp.value = '';
  const id = currentDiv;
  sendMessage(id, 'user', text);
  meetAndAnswer(id, text);
}

async function meetAndAnswer(id, q) {
  const lines = ['Menganalisis pertanyaan...', 'Mengambil data terkait...', 'Diskusi tim divisi...', 'Menyusun jawaban...'];
  const t = $('mtable'); t.innerHTML = '';
  const pos = [['15%','25%'],['75%','25%'],['15%','60%'],['75%','60%'],['45%','5%']];
  const team = chars.filter(c => c.divId === id).concat(chars.filter(c => c.home === id && c.divId !== id)).slice(0, 5);
  (team.length ? team : [chars.find(c => c.home === id)]).forEach((c, i) => {
    const a = document.createElement('div');
    a.className = 'mav'; a.textContent = c.emoji;
    a.style.cssText = `left:${pos[i][0]};top:${pos[i][1]};border-color:${c.color}`;
    t.appendChild(a);
  });
  $('meet').classList.add('open');
  for (const l of lines) { $('mline').textContent = l; await sleep(800); }
  $('meet').classList.remove('open');
  const ans = demoAnswer(id, q);
  setRoom(id, ans);
  sendMessage(id, 'ai', ans);
}

function demoAnswer(id, text) {
  const d = DIVISIONS.find(x => x.id === id), t = text.toLowerCase();
  if (/\b(hai|halo)\b/.test(t)) return `Halo! Saya dari divisi ${d.name}. Ada yang bisa saya bantu?`;
  if (t.includes('harga')) return 'Informasi harga terkini akan kami perbarui di layar divisi.';
  if (t.includes('reksadana')) return 'Reksadana adalah kumpulan dana yang dikelola profesional oleh manajer investasi.';
  if (t.includes('bitcoin') || t.includes('btc')) return 'Bitcoin adalah aset digital terdesentralisasi berbasis blockchain.';
  if (t.includes('emas')) return 'Emas logam mulia sering dipakai sebagai pelindung nilai dari inflasi.';
  if (t.includes('resep')) return 'Resep masakan dan minuman siap dibagikan sesuai permintaan Anda.';
  return `Ini jawaban dari divisi ${d.name}. ${d.auto || 'Silakan ajukan pertanyaan lebih spesifik.'}`;
}
