name: Kantor AI QA

on:
  push:
    branches:
      - main
      - feature/premium-visual-makeover-phase-1
  pull_request:
    branches:
      - main

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Phase 5 static QA
        run: node scripts/qa.mjs
