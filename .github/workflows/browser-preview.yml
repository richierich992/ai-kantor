name: Kantor AI Browser Preview

on:
  push:
    branches:
      - feature/premium-visual-makeover-phase-1
  pull_request:
    branches:
      - main

jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kantor-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kantor-preview-server.log
          exit 1
      - name: Run desktop and mobile browser preview
        run: node tests/preview.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kantor-ai-phase-6-browser-preview
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
